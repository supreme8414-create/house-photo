<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本機 AI 引擎測試</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #f4f4f4; color: #222; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  figure { margin: 0; flex: 1 1 300px; }
  canvas { width: 100%; height: auto; background: #ccc; display: block; }
  button { font-size: 16px; padding: 10px 16px; margin: 4px 4px 4px 0; }
  pre { background: #111; color: #9f9; padding: 8px; font-size: 12px; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
  progress { width: 100%; }
</style>
</head>
<body>
<h1>本機 AI 引擎測試（engine/local.js）</h1>
<p>
  <label>尺寸 <select id="size">
    <option value="1200x900">1200×900</option>
    <option value="4000x3000">4000×3000（手機大圖）</option>
    <option value="640x480">640×480</option>
  </select></label>
  <label><input type="checkbox" id="multi" checked> 多個雜物</label>
</p>
<button id="load">1. 預先載入模型</button>
<button id="run">2. 產生測試圖並移除雜物</button>
<progress id="prog" value="0" max="1"></progress>
<div id="status">尚未開始</div>
<div class="row">
  <figure><figcaption>原圖</figcaption><canvas id="before"></canvas></figure>
  <figure><figcaption>遮罩</figcaption><canvas id="mask"></canvas></figure>
  <figure><figcaption>結果</figcaption><canvas id="after"></canvas></figure>
</div>
<pre id="log"></pre>
<script type="module">
import { loadLocalModel, inpaintLocal, getLocalEngineInfo } from './local.js';

const $ = (id) => document.getElementById(id);
const logEl = $('log');
for (const k of ['log', 'warn', 'error']) {
  const orig = console[k].bind(console);
  console[k] = (...a) => {
    orig(...a);
    logEl.textContent += `[${k}] ` + a.map((x) => (x instanceof Error ? x.message + (x.cause ? ' ← ' + (x.cause.message || x.cause) : '') : typeof x === 'object' ? JSON.stringify(x) : String(x))).join(' ') + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  };
}
console.log('crossOriginIsolated=', self.crossOriginIsolated, 'navigator.gpu=', !!navigator.gpu, 'cores=', navigator.hardwareConcurrency);

function onProgress(p) {
  const prog = $('prog');
  prog.max = p.total || 1; prog.value = p.loaded || 0;
  const pct = p.total ? Math.round((p.loaded / p.total) * 100) : 0;
  $('status').textContent = `${p.stage} ${p.total > 1000 ? (p.loaded / 1e6).toFixed(1) + '/' + (p.total / 1e6).toFixed(1) + 'MB' : ''} ${pct}%`;
}

function makeTestImage(W, H, multi) {
  const img = document.createElement('canvas'); img.width = W; img.height = H;
  const g = img.getContext('2d');
  // 牆面漸層 + 地板 + 一點紋理
  const wall = g.createLinearGradient(0, 0, W, H * 0.7);
  wall.addColorStop(0, '#e9e2d4'); wall.addColorStop(1, '#cfc6b4');
  g.fillStyle = wall; g.fillRect(0, 0, W, H * 0.7);
  const floor = g.createLinearGradient(0, H * 0.7, 0, H);
  floor.addColorStop(0, '#8a6a4a'); floor.addColorStop(1, '#5e4630');
  g.fillStyle = floor; g.fillRect(0, H * 0.7, W, H * 0.3);
  g.strokeStyle = 'rgba(0,0,0,.15)'; g.lineWidth = Math.max(1, W / 800);
  for (let x = 0; x < W; x += W / 12) { g.beginPath(); g.moveTo(x, H * 0.7); g.lineTo(x - W * 0.1, H); g.stroke(); }
  g.fillStyle = '#fff'; g.fillRect(W * 0.6, H * 0.15, W * 0.25, H * 0.3); // 窗戶（不應被改動）
  // 雜物
  const items = [{ x: 0.2, y: 0.55, w: 0.14, h: 0.25, c: '#c0392b' }];
  if (multi) items.push({ x: 0.7, y: 0.75, w: 0.08, h: 0.1, c: '#2e86de' }, { x: 0.05, y: 0.1, w: 0.05, h: 0.06, c: '#27ae60' });
  const mask = document.createElement('canvas'); mask.width = W; mask.height = H;
  const m = mask.getContext('2d');
  m.fillStyle = '#000'; m.fillRect(0, 0, W, H);
  m.fillStyle = '#fff';
  for (const it of items) {
    g.fillStyle = it.c; g.fillRect(it.x * W, it.y * H, it.w * W, it.h * H);
    // 自動遮罩：雜物外框（稍微手繪式地外擴一點）
    const p = Math.max(2, W * 0.004);
    m.fillRect(it.x * W - p, it.y * H - p, it.w * W + 2 * p, it.h * H + 2 * p);
  }
  return { img, mask };
}

function show(id, c) {
  const d = $(id); d.width = c.width; d.height = c.height; d.getContext('2d').drawImage(c, 0, 0);
}

$('load').onclick = async () => {
  const t = performance.now();
  try {
    await loadLocalModel(onProgress);
    console.log('model loaded in', Math.round(performance.now() - t), 'ms', getLocalEngineInfo());
    $('status').textContent = '模型就緒：' + JSON.stringify(getLocalEngineInfo());
  } catch (e) { console.error(e); $('status').textContent = '錯誤：' + e.message; }
};

$('run').onclick = async () => {
  const [W, H] = $('size').value.split('x').map(Number);
  const { img, mask } = makeTestImage(W, H, $('multi').checked);
  show('before', img); show('mask', mask);
  const t = performance.now();
  try {
    const out = await inpaintLocal(img, mask, onProgress);
    const ms = Math.round(performance.now() - t);
    show('after', out);
    // 驗證：遮罩外（遠離遮罩）的像素應完全相同
    const a = img.getContext('2d').getImageData(W - 50, H - 50, 50, 50).data;
    const b = out.getContext('2d').getImageData(W - 50, H - 50, 50, 50).data;
    let same = 0; for (let i = 0; i < a.length; i++) if (a[i] === b[i]) same++;
    console.log(`inpaint ${W}x${H} done in ${ms}ms; out ${out.width}x${out.height}; untouched bottom-right corner identical=${same === a.length}`, getLocalEngineInfo());
    $('status').textContent = `完成：${ms} ms（${getLocalEngineInfo().backend}）`;
  } catch (e) { console.error(e); $('status').textContent = '錯誤：' + e.message; }
};
</script>
</body>
</html>
